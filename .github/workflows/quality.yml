# SPDX-License-Identifier: AGPL-3.0-only
name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public source, Python syntax, and licenses
        run: python3 scripts/check-source.py
      - name: Validate shell syntax
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Validate localization sources when present
        shell: bash
        run: |
          if [[ -f scripts/compile-localizations.py ]]; then
            python3 scripts/compile-localizations.py --check
          fi
      # Swift builds, sanitizer execution, and audio checks require the supported
      # Apple Silicon/macOS toolchain and are not performed by this Linux job.
